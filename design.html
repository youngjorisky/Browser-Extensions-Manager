<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="design.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Overpass:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Extensions Manager</title>
</head>

<body>
    <div class="all">
        <div class="extensions">
            <div class="extensions-bar">
                <img src="./assets/images/logo.svg">
                <button class="toggle-btn" id="toggle-btn">
                    <img id="toggle-icon" src="./assets/images/icon-moon.svg">
                </button>
            </div>
            <div class="selection-bar">
                <h1>Extensions List</h1>
                <div class="selections">
                    <button id="all-button" class="options" onclick="selectionActive(this)">All</button>
                    <button id="active-button" class="options" onclick="selectionActive(this)">Active</button>
                    <button id="inactive-button" class="options" onclick="selectionActive(this)">Inactive</button>
                </div>
            </div>
        </div>
        <div class="main-container" id="main-container">
    </div>

    <script src="design.js"></script>
</body>
</html>
